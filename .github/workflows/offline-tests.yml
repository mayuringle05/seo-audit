name: SEO audit offline tests

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/audit.py scripts/test_audit.py
      - name: Run offline suite
        run: python scripts/test_audit.py
